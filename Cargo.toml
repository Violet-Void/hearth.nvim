[package]
name = "hearth"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Neovim sound effects and procedural ambience plugin"
repository = "https://github.com/Violet-Void/hearth.nvim"

[lib]
crate-type = ["cdylib"]
name = "hearth"

[dependencies]
mlua = { version = "0.10.3", features = ["module", "luajit"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
sfxr = { git = "https://github.com/bzar/sfxr-rs", branch = "master" }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
