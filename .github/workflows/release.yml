name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload_artifacts: true

  release:
    name: Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Checkout license notices
        uses: actions/checkout@v4
        with:
          path: _repo
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Bundle license notices
        run: |
          cp _repo/LICENSE _repo/THIRD_PARTY_LICENSES.md release-assets/

      - name: Verify artifacts
        run: |
          if [ -z "$(find release-assets -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \))" ]; then
            echo "No native artifacts found!"
            exit 1
          fi

      - name: Generate checksums
        run: |
          find release-assets -type f -not -name "*.sha256" | while IFS= read -r file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          token: ${{ github.token }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
